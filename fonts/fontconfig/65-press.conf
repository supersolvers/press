<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <description>The press fonts: use the pixel-exact embedded bitmaps, mark the terminal faces as monospaced, say which serve Chinese, map the historical names</description>

  <!-- Qt only uses embedded bitmaps when asked; GTK and browsers do so by default -->
  <match target="font"><test name="family"><string>Cicero</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit></match>
  <match target="font"><test name="family"><string>Agate</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit></match>
  <match target="font"><test name="family"><string>Brevier</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit></match>
  <match target="font"><test name="family"><string>Pica</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit></match>
  <match target="font"><test name="family"><string>Elite</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit></match>
  <match target="font"><test name="family"><string>Fleuron</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit></match>
  <match target="font"><test name="family"><string>Vignette</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit></match>
  <match target="font"><test name="family"><string>Cartouche</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit></match>

  <!-- At the size each face was drawn for, switch anti-aliasing off so every toolkit shows the exact pixels.
       Qt otherwise renders the outlines; other sizes stay anti-aliased. -->
  <match target="font"><test name="family"><string>Cicero</string></test><test name="pixelsize" compare="eq"><double>12</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit></match>
  <match target="font"><test name="family"><string>Agate</string></test><test name="pixelsize" compare="eq"><double>11</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit></match>
  <match target="font"><test name="family"><string>Brevier</string></test><test name="pixelsize" compare="eq"><double>12</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit></match>
  <match target="font"><test name="family"><string>Pica</string></test><test name="pixelsize" compare="eq"><double>12</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit></match>
  <match target="font"><test name="family"><string>Elite</string></test><test name="pixelsize" compare="eq"><double>16</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit></match>
  <match target="font"><test name="family"><string>Fleuron</string></test><test name="pixelsize" compare="eq"><double>12</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit></match>
  <match target="font"><test name="family"><string>Vignette</string></test><test name="pixelsize" compare="eq"><double>14</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit></match>
  <match target="font"><test name="family"><string>Cartouche</string></test><test name="pixelsize" compare="eq"><double>24</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit></match>

  <!-- Full-width CJK makes fontconfig class these as dual-width, which Qt does not accept as fixed pitch -->
  <match target="scan"><test name="family"><string>Pica</string></test>
    <edit name="spacing" mode="assign"><int>100</int></edit></match>
  <match target="scan"><test name="family"><string>Elite</string></test>
    <edit name="spacing" mode="assign"><int>100</int></edit></match>

  <!-- The text families carry the characters of Simplified Chinese (all but 36 rare ones of the 6,765 fontconfig
       asks for), so they are said to serve it: an application asking for a Chinese font can be given them. They are
       not said to serve Traditional Chinese, of which some 800 are missing. -->
  <match target="scan"><test name="family"><string>Cicero</string></test>
    <edit name="lang" mode="assign"><plus><name>lang</name><langset><string>zh-cn</string><string>zh-sg</string></langset></plus></edit></match>
  <match target="scan"><test name="family"><string>Agate</string></test>
    <edit name="lang" mode="assign"><plus><name>lang</name><langset><string>zh-cn</string><string>zh-sg</string></langset></plus></edit></match>
  <match target="scan"><test name="family"><string>Brevier</string></test>
    <edit name="lang" mode="assign"><plus><name>lang</name><langset><string>zh-cn</string><string>zh-sg</string></langset></plus></edit></match>
  <match target="scan"><test name="family"><string>Pica</string></test>
    <edit name="lang" mode="assign"><plus><name>lang</name><langset><string>zh-cn</string><string>zh-sg</string></langset></plus></edit></match>
  <match target="scan"><test name="family"><string>Elite</string></test>
    <edit name="lang" mode="assign"><plus><name>lang</name><langset><string>zh-cn</string><string>zh-sg</string></langset></plus></edit></match>

  <!-- Requests for the historical names get the counterpart, unless the real font is installed -->
  <alias><family>Chicago</family><accept><family>Cicero</family></accept></alias>
  <alias><family>Geneva</family><accept><family>Brevier</family></accept></alias>
  <alias><family>Monaco</family><accept><family>Pica</family></accept></alias>
  <alias><family>MS Sans Serif</family><accept><family>Agate</family></accept></alias>
  <alias><family>Microsoft Sans Serif</family><accept><family>Agate</family></accept></alias>
  <alias><family>Fixedsys</family><accept><family>Elite</family></accept></alias>
  <alias><family>Terminal</family><accept><family>Elite</family></accept></alias>
  <alias binding="same"><family>Marlett</family><accept><family>Fleuron</family></accept></alias>
  <alias><family>FontAwesome</family><accept><family>Vignette</family></accept></alias>
</fontconfig>
