[package]
name = "press"
description = "The press shared library: the C ABI over the engine, plus display backends"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
press-core = { path = "../press-core" }
accesskit = "0.25"
accesskit_unix = "0.24"
libc = "0.2"
png = "0.18"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["xkbcommon"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
libc = "0.2"

[build-dependencies]
press-idl = { path = "../press-idl" }
